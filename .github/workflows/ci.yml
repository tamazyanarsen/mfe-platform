name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Границы пакетов: ядро не знает о фреймворках и адаптерах.
      - run: bun run check:boundaries
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Шаблоны create:remote: генерируются, проходят тест контракта и собираются.
      - run: bun run check:templates
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
